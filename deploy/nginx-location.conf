location = /vue-sentry-starter {
    return 301 /vue-sentry-starter/;
}

# 通过同源入口转发 Sentry envelope，避免 HTTP 页面触发 PNA/CORS 拦截。
location = /vue-sentry-starter/sentry-tunnel {
    proxy_pass https://o4505368794300416.ingest.us.sentry.io/api/4511880739094528/envelope/;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    proxy_set_header Host o4505368794300416.ingest.us.sentry.io;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_hide_header Server;
}

location ^~ /vue-sentry-starter/ {
    alias /var/www/vue-sentry-starter/current/;
    try_files $uri $uri/ /vue-sentry-starter/index.html;
}
